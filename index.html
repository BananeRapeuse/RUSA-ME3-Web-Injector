<script>
"use strict";

/*
 * ============================================================
 *  EMERALD ME3 INJECTOR
 * ============================================================
 *
 *  V1
 *
 *  Pokémon Emerald Gen III
 *
 *  Save:
 *      2 x 0xE000 byte save blocks
 *      14 x 0x1000 byte sectors per block
 *
 *  Sector:
 *      0x0000 - 0x0F7F : data
 *      0x0FF4 - 0x0FF5 : section ID
 *      0x0FF6 - 0x0FF7 : checksum
 *      0x0FF8 - 0x0FFB : signature
 *      0x0FFC - 0x0FFF : save index
 *
 *  Emerald:
 *      Section ID 4
 *      Mystery Event = +0x8A8
 *      Mystery Event size = 0x3EC (1004 bytes)
 *
 *  ME3:
 *      0x000 - 0x001 : checksum
 *      0x002 - 0x003 : padding
 *      0x004 - 0x3EB : 1000 byte script
 *
 *  Optional:
 *      0x3EC - 0x3F3 : Record Mixing Gift
 *
 * ============================================================
 */


/* ============================================================
 * CONSTANTES
 * ============================================================
 */

const SAVE_SIZE = 0x20000;

const SAVE_BLOCK_SIZE = 0xE000;

const SECTOR_SIZE = 0x1000;

const SECTOR_DATA_SIZE = 0xF80;

const SECTION_ID_OFFSET = 0xFF4;

const SECTION_CHECKSUM_OFFSET = 0xFF6;

const SECTION_SIGNATURE_OFFSET = 0xFF8;

const SAVE_INDEX_OFFSET = 0xFFC;

const SECTION_MYSTERY_EVENT = 4;

const MYSTERY_EVENT_OFFSET = 0x8A8;

const MYSTERY_EVENT_SIZE = 0x3EC;

const MYSTERY_EVENT_DATA_OFFSET = 0x04;

const MYSTERY_EVENT_DATA_SIZE = 0x3E8;

const RECORD_MIXING_OFFSET = 0xC94;

const RECORD_MIXING_SIZE = 0x08;


/*
 * Gen III sector signature.
 *
 * The known footer contains the magic number 0x08012025.
 *
 * We don't blindly trust this value alone.
 * We additionally validate all 14 section IDs.
 */
const SECTION_SIGNATURE = 0x08012025;


/* ============================================================
 * DOM
 * ============================================================
 */

const saveInput = document.getElementById("saveInput");
const me3Input = document.getElementById("me3Input");

const saveName = document.getElementById("saveName");
const me3Name = document.getElementById("me3Name");

const saveSize = document.getElementById("saveSize");
const saveStructure = document.getElementById("saveStructure");

const slotA = document.getElementById("slotA");
const slotB = document.getElementById("slotB");

const me3Size = document.getElementById("me3Size");
const me3Structure = document.getElementById("me3Structure");

const injectButton = document.getElementById("injectButton");
const diagnosticButton = document.getElementById("diagnosticButton");

const resultCard = document.getElementById("resultCard");
const resultText = document.getElementById("resultText");
const downloadButton = document.getElementById("downloadButton");

const logElement = document.getElementById("log");


/* ============================================================
 * ÉTAT
 * ============================================================
 */

let saveBytes = null;
let me3Bytes = null;

let generatedSave = null;

let saveInfo = null;
let me3Info = null;


/* ============================================================
 * LOG
 * ============================================================
 */

function clearLog() {
    logElement.innerHTML = "";
}


function log(message, type = "info") {

    const line = document.createElement("div");

    line.className = "log-line";

    if (type === "ok") {
        line.classList.add("log-ok");
    }

    if (type === "error") {
        line.classList.add("log-error");
    }

    if (type === "warning") {
        line.classList.add("log-warning");
    }

    if (type === "info") {
        line.classList.add("log-info");
    }

    line.textContent = message;

    logElement.appendChild(line);

    logElement.scrollTop = logElement.scrollHeight;
}


/* ============================================================
 * UTILITAIRES
 * ============================================================
 */

function hex(value, width = 4) {
    return "0x" + value
        .toString(16)
        .toUpperCase()
        .padStart(width, "0");
}


function readU16LE(bytes, offset) {

    return (
        bytes[offset] |
        (bytes[offset + 1] << 8)
    ) >>> 0;
}


function writeU16LE(bytes, offset, value) {

    bytes[offset] = value & 0xFF;

    bytes[offset + 1] =
        (value >>> 8) & 0xFF;
}


function readU32LE(bytes, offset) {

    return (
        bytes[offset] |
        (bytes[offset + 1] << 8) |
        (bytes[offset + 2] << 16) |
        (bytes[offset + 3] << 24)
    ) >>> 0;
}


function writeU32LE(bytes, offset, value) {

    bytes[offset] = value & 0xFF;

    bytes[offset + 1] =
        (value >>> 8) & 0xFF;

    bytes[offset + 2] =
        (value >>> 16) & 0xFF;

    bytes[offset + 3] =
        (value >>> 24) & 0xFF;
}


function arrayIsEmpty(bytes, start, length) {

    for (let i = 0; i < length; i++) {

        const value = bytes[start + i];

        if (value !== 0x00 && value !== 0xFF) {
            return false;
        }
    }

    return true;
}


/* ============================================================
 * CHECKSUM ME3
 *
 * Emerald Mystery Event:
 *
 * checksum = sum of 16-bit little-endian words
 * over bytes 0x04..0x3EB
 *
 * Result = low 16 bits.
 * ============================================================
 */

function calculateMysteryEventChecksum(bytes) {

    let sum = 0;

    for (
        let offset = MYSTERY_EVENT_DATA_OFFSET;
        offset < MYSTERY_EVENT_SIZE;
        offset += 2
    ) {

        const word =
            bytes[offset] |
            (bytes[offset + 1] << 8);

        sum =
            (sum + word) >>> 0;
    }

    return sum & 0xFFFF;
}


function fixMysteryEventChecksum(bytes) {

    const checksum =
        calculateMysteryEventChecksum(bytes);

    writeU16LE(
        bytes,
        0,
        checksum
    );

    return checksum;
}


/* ============================================================
 * CHECKSUM RECORD MIXING
 * ============================================================
 */

function calculateRecordMixingChecksum(bytes, offset) {

    let sum = 0;

    for (let i = 4; i < 8; i += 2) {

        const word =
            bytes[offset + i] |
            (bytes[offset + i + 1] << 8);

        sum =
            (sum + word) >>> 0;
    }

    return sum & 0xFFFF;
}


function fixRecordMixingChecksum(bytes, offset) {

    const checksum =
        calculateRecordMixingChecksum(
            bytes,
            offset
        );

    writeU16LE(
        bytes,
        offset,
        checksum
    );

    return checksum;
}


/* ============================================================
 * CHECKSUM SECTEUR GEN III
 *
 * Le checksum de section est calculé sur la zone DATA,
 * avec des mots de 32 bits little-endian.
 *
 * sum += u32
 * checksum = sum + (sum >> 16)
 * low 16 bits
 * ============================================================
 */

function calculateSectionChecksum(
    bytes,
    sectorOffset,
    dataSize
) {

    let sum = 0;

    const end =
        sectorOffset + dataSize;

    for (
        let offset = sectorOffset;
        offset < end;
        offset += 4
    ) {

        const value =
            readU32LE(bytes, offset);

        sum =
            (sum + value) >>> 0;
    }

    sum =
        (sum + Math.floor(sum / 0x10000))
        >>> 0;

    return sum & 0xFFFF;
}


function fixSectionChecksum(
    bytes,
    sectorOffset,
    dataSize
) {

    const checksum =
        calculateSectionChecksum(
            bytes,
            sectorOffset,
            dataSize
        );

    writeU16LE(
        bytes,
        sectorOffset + SECTION_CHECKSUM_OFFSET,
        checksum
    );

    return checksum;
}


/* ============================================================
 * LECTURE D'UN SECTEUR
 * ============================================================
 */

function readSectorInfo(bytes, sectorOffset) {

    const id =
        readU16LE(
            bytes,
            sectorOffset + SECTION_ID_OFFSET
        );

    const checksum =
        readU16LE(
            bytes,
            sectorOffset + SECTION_CHECKSUM_OFFSET
        );

    const signature =
        readU32LE(
            bytes,
            sectorOffset + SECTION_SIGNATURE_OFFSET
        );

    const saveIndex =
        readU32LE(
            bytes,
            sectorOffset + SAVE_INDEX_OFFSET
        );

    const calculatedChecksum =
        calculateSectionChecksum(
            bytes,
            sectorOffset,
            SECTOR_DATA_SIZE
        );

    return {
        offset: sectorOffset,
        id,
        checksum,
        calculatedChecksum,
        checksumValid:
            checksum === calculatedChecksum,
        signature,
        signatureValid:
            signature === SECTION_SIGNATURE,
        saveIndex
    };
}


/* ============================================================
 * ANALYSE D'UN SLOT
 * ============================================================
 */

function analyzeSaveBlock(
    bytes,
    blockOffset
) {

    const sections = [];

    const seenIds = new Set();

    for (let sector = 0; sector < 14; sector++) {

        const offset =
            blockOffset +
            sector * SECTOR_SIZE;

        const info =
            readSectorInfo(
                bytes,
                offset
            );

        sections.push(info);

        if (info.id <= 13) {
            seenIds.add(info.id);
        }
    }

    const validIds =
        seenIds.size === 14;

    const section4 =
        sections.find(
            section =>
                section.id === SECTION_MYSTERY_EVENT
        );

    return {
        blockOffset,
        sections,
        validIds,
        section4
    };
}


/* ============================================================
 * ANALYSE COMPLETE SAVE
 * ============================================================
 */

function analyzeSave(bytes) {

    if (bytes.length !== SAVE_SIZE) {

        return {
            valid: false,
            reason:
                `Taille incorrecte : ${bytes.length} octets`
        };
    }

    const blockA =
        analyzeSaveBlock(
            bytes,
            0
        );

    const blockB =
        analyzeSaveBlock(
            bytes,
            SAVE_BLOCK_SIZE
        );

    const slotAIndexes =
        blockA.sections
            .map(s => s.saveIndex);

    const slotBIndexes =
        blockB.sections
            .map(s => s.saveIndex);

    const maxA =
        Math.max(...slotAIndexes);

    const maxB =
        Math.max(...slotBIndexes);

    /*
     * Un slot cohérent doit contenir les 14 IDs.
     */

    const validA =
        blockA.validIds;

    const validB =
        blockB.validIds;

    /*
     * Nous acceptons également les sauvegardes où
     * les checksums d'origine sont déjà mauvais.
     *
     * Le but est de pouvoir réparer la section modifiée.
     */

    const valid =
        validA || validB;

    return {
        valid,
        blockA,
        blockB,
        latestBlock:
            maxA >= maxB ? "A" : "B",
        maxA,
        maxB
    };
}


/* ============================================================
 * ANALYSE ME3
 * ============================================================
 */

function analyzeME3(bytes) {

    if (
        bytes.length !== MYSTERY_EVENT_SIZE &&
        bytes.length !==
            MYSTERY_EVENT_SIZE +
            RECORD_MIXING_SIZE
    ) {

        return {
            valid: false,
            reason:
                `Taille ${bytes.length} octets. ` +
                `Attendu ${MYSTERY_EVENT_SIZE} ` +
                `ou ${MYSTERY_EVENT_SIZE + RECORD_MIXING_SIZE}.`
        };
    }

    const event =
        bytes.slice(
            0,
            MYSTERY_EVENT_SIZE
        );

    const storedChecksum =
        readU16LE(
            event,
            0
        );

    const calculatedChecksum =
        calculateMysteryEventChecksum(
            event
        );

    const checksumValid =
        storedChecksum ===
        calculatedChecksum;

    const hasRecordMixing =
        bytes.length ===
        MYSTERY_EVENT_SIZE +
        RECORD_MIXING_SIZE;

    let recordMixingChecksum = null;

    let recordMixingChecksumValid = null;

    if (hasRecordMixing) {

        const offset =
            MYSTERY_EVENT_SIZE;

        recordMixingChecksum =
            readU16LE(
                bytes,
                offset
            );

        const calculated =
            calculateRecordMixingChecksum(
                bytes,
                offset
            );

        recordMixingChecksumValid =
            recordMixingChecksum ===
            calculated;
    }

    return {
        valid: true,
        size: bytes.length,
        checksumValid,
        storedChecksum,
        calculatedChecksum,
        hasRecordMixing,
        recordMixingChecksum,
        recordMixingChecksumValid
    };
}


/* ============================================================
 * MISE À JOUR UI SAVE
 * ============================================================
 */

function updateSaveUI() {

    if (!saveBytes) {

        saveSize.textContent = "—";
        saveStructure.textContent = "—";
        slotA.textContent = "—";
        slotB.textContent = "—";

        return;
    }

    saveSize.textContent =
        `${saveBytes.length.toLocaleString("fr-FR")} o`;

    if (!saveInfo.valid) {

        saveStructure.textContent =
            "❌ Invalide";

        saveStructure.className =
            "status-value bad";

        return;
    }

    saveStructure.textContent =
        "✅ Gen III";

    saveStructure.className =
        "status-value ok";

    slotA.textContent =
        saveInfo.blockA.validIds
            ? `✅ ${saveInfo.maxA}`
            : "⚠️ Incomplet";

    slotB.textContent =
        saveInfo.blockB.validIds
            ? `✅ ${saveInfo.maxB}`
            : "⚠️ Incomplet";
}


/* ============================================================
 * MISE À JOUR UI ME3
 * ============================================================
 */

function updateME3UI() {

    if (!me3Bytes) {

        me3Size.textContent = "—";
        me3Structure.textContent = "—";

        return;
    }

    me3Size.textContent =
        `${me3Bytes.length.toLocaleString("fr-FR")} o`;

    if (!me3Info.valid) {

        me3Structure.textContent =
            "❌ Invalide";

        me3Structure.className =
            "status-value bad";

        return;
    }

    if (me3Info.checksumValid) {

        me3Structure.textContent =
            me3Info.hasRecordMixing
                ? "✅ ME3 + RM3"
                : "✅ ME3";

        me3Structure.className =
            "status-value ok";

    } else {

        /*
         * PKHeX corrige le checksum lors de l'import.
         * Donc un ME3 dont le checksum est mauvais n'est
         * pas forcément inutilisable.
         */

        me3Structure.textContent =
            "⚠️ ME3 checksum à corriger";

        me3Structure.className =
            "status-value warning";
    }
}


/* ============================================================

/* ============================================================
 * RECHERCHE SECTION 4
 * ============================================================
 */

function getSection4(blockInfo) {

    if (!blockInfo) {
        return null;
    }

    return blockInfo.sections.find(
        section =>
            section.id ===
            SECTION_MYSTERY_EVENT
    ) || null;
}


/* ============================================================
 * INJECTION DANS UN SLOT
 * ============================================================
 */

function injectIntoBlock(
    bytes,
    blockInfo,
    me3
) {

    const section4 =
        getSection4(blockInfo);

    if (!section4) {

        throw new Error(
            "Section ID 4 introuvable."
        );
    }

    const sectionOffset =
        section4.offset;

    const mysteryOffset =
        sectionOffset +
        MYSTERY_EVENT_OFFSET;

    /*
     * --------------------------------------------------------
     * ME3
     * --------------------------------------------------------
     */

    const event =
        me3.slice(
            0,
            MYSTERY_EVENT_SIZE
        );

    /*
     * Corriger le checksum du ME3.
     */

    const eventChecksum =
        fixMysteryEventChecksum(
            event
        );

    /*
     * Copier l'événement dans la section.
     */

    bytes.set(
        event,
        mysteryOffset
    );

    /*
     * --------------------------------------------------------
     * RECORD MIXING GIFT
     * --------------------------------------------------------
     */

    let recordMixingChecksum =
        null;

    if (
        me3.length ===
        MYSTERY_EVENT_SIZE +
        RECORD_MIXING_SIZE
    ) {

        const rm3 =
            me3.slice(
                MYSTERY_EVENT_SIZE,
                MYSTERY_EVENT_SIZE +
                RECORD_MIXING_SIZE
            );

        recordMixingChecksum =
            fixRecordMixingChecksum(
                rm3,
                0
            );

        bytes.set(
            rm3,
            sectionOffset +
            RECORD_MIXING_OFFSET
        );
    }

    /*
     * --------------------------------------------------------
     * WONDER CARD
     * --------------------------------------------------------
     *
     * PKHeX efface la Wonder Card pour FRLG/E lors
     * de l'import d'un ME3.
     *
     * Emerald section 4 Wonder Card:
     *
     * 0x56C
     *
     * taille internationale:
     * 0x154 = 340 bytes
     *
     * Nous nettoyons la zone complète connue.
     */

    const wonderCardOffset =
        sectionOffset +
        0x56C;

    const wonderCardSize =
        0x154;

    bytes.fill(
        0x00,
        wonderCardOffset,
        wonderCardOffset +
        wonderCardSize
    );

    /*
     * --------------------------------------------------------
     * CHECKSUM SECTION
     * --------------------------------------------------------
     */

    const sectionChecksum =
        fixSectionChecksum(
            bytes,
            sectionOffset,
            SECTOR_DATA_SIZE
        );

    return {
        sectionOffset,
        mysteryOffset,
        eventChecksum,
        sectionChecksum,
        recordMixingChecksum
    };
}


/* ============================================================
 * INJECTION COMPLETE
 * ============================================================
 */

function performInjection() {

    clearLog();

    resultCard.classList.add("hidden");

    generatedSave = null;

    if (!saveBytes || !me3Bytes) {

        log(
            "❌ Sélectionne une sauvegarde et un ME3.",
            "error"
        );

        return;
    }

    log(
        "🚀 Début de l'injection...",
        "info"
    );

    /*
     * Copie complète.
     */

    const output =
        new Uint8Array(
            saveBytes
        );

    /*
     * --------------------------------------------------------
     * SLOT A
     * --------------------------------------------------------
     */

    let resultA = null;

    if (saveInfo.blockA.validIds) {

        log(
            "🔎 Slot A : section ID 4 recherchée...",
            "info"
        );

        resultA =
            injectIntoBlock(
                output,
                saveInfo.blockA,
                me3Bytes
            );

        log(
            `✅ Slot A : section 4 trouvée à ` +
            `${hex(resultA.sectionOffset)}.`,
            "ok"
        );

        log(
            `   Mystery Event : ` +
            `${hex(resultA.mysteryOffset)}.`,
            "ok"
        );

        log(
            `   ME3 checksum : ` +
            `${hex(resultA.eventChecksum)}.`,
            "ok"
        );

        log(
            `   Section checksum : ` +
            `${hex(resultA.sectionChecksum)}.`,
            "ok"
        );

        if (
            resultA.recordMixingChecksum !==
            null
        ) {

            log(
                `   RM3 checksum : ` +
                `${hex(resultA.recordMixingChecksum)}.`,
                "ok"
            );
        }

    } else {

        log(
            "⚠️ Slot A ignoré : sections invalides.",
            "warning"
        );
    }


    /*
     * --------------------------------------------------------
     * SLOT B
     * --------------------------------------------------------
     */

    let resultB = null;

    if (saveInfo.blockB.validIds) {

        log(
            "🔎 Slot B : section ID 4 recherchée...",
            "info"
        );

        resultB =
            injectIntoBlock(
                output,
                saveInfo.blockB,
                me3Bytes
            );

        log(
            `✅ Slot B : section 4 trouvée à ` +
            `${hex(resultB.sectionOffset)}.`,
            "ok"
        );

        log(
            `   Mystery Event : ` +
            `${hex(resultB.mysteryOffset)}.`,
            "ok"
        );

        log(
            `   ME3 checksum : ` +
            `${hex(resultB.eventChecksum)}.`,
            "ok"
        );

        log(
            `   Section checksum : ` +
            `${hex(resultB.sectionChecksum)}.`,
            "ok"
        );

        if (
            resultB.recordMixingChecksum !==
            null
        ) {

            log(
                `   RM3 checksum : ` +
                `${hex(resultB.recordMixingChecksum)}.`,
                "ok"
            );
        }

    } else {

        log(
            "⚠️ Slot B ignoré : sections invalides.",
            "warning"
        );
    }


    /*
     * --------------------------------------------------------
     * VALIDATION
     * --------------------------------------------------------
     */

    log(
        "🔬 Vérification de la sauvegarde générée...",
        "info"
    );

    const validation =
        analyzeSave(
            output
        );

    if (!validation.valid) {

        log(
            "❌ La sauvegarde générée n'est pas reconnue.",
            "error"
        );

        return;
    }

    /*
     * Vérifier les checksums des deux sections 4.
     */

    const validateSection =
        (block) => {

            const section =
                getSection4(block);

            if (!section) {
                return false;
            }

            return section.checksumValid;
        };

    const sectionAValid =
        validateSection(
            validation.blockA
        );

    const sectionBValid =
        validateSection(
            validation.blockB
        );

    log(
        `Slot A section 4 checksum : ` +
        `${sectionAValid ? "✅" : "❌"}`,
        sectionAValid
            ? "ok"
            : "error"
    );

    log(
        `Slot B section 4 checksum : ` +
        `${sectionBValid ? "✅" : "❌"}`,
        sectionBValid
            ? "ok"
            : "error"
    );

    if (
        !sectionAValid &&
        !sectionBValid
    ) {

        log(
            "❌ Les checksums de section sont invalides.",
            "error"
        );

        return;
    }

    /*
     * --------------------------------------------------------
     * SUCCÈS
     * --------------------------------------------------------
     */

    generatedSave =
        output;

    const filename =
        "Emerald_ME3_injected.sav";

    resultText.innerHTML =
        `
        <strong>${filename}</strong><br><br>
        Mystery Event injecté dans la section 4.<br>
        Les checksums ME3 et section ont été recalculés.<br>
        La Wonder Card a été nettoyée.
        `;

    resultCard.classList.remove(
        "hidden"
    );

    log(
        "🎉 Injection terminée avec succès.",
        "ok"
    );

    log(
        "💾 La sauvegarde originale n'a pas été modifiée.",
        "ok"
    );
}


/* ============================================================

 * ============================================================
 */

function runDiagnostic() {

    clearLog();

    log(
        "════════════════════════════════════",
        "info"
    );

    log(
        "🔬 EMERALD ME3 INJECTOR — DIAGNOSTIC",
        "info"
    );

        "info"
    );

    /*

            "error"
        );

    } else {

        log(

            "info"
        );

        if (
            saveBytes.length ===
            SAVE_SIZE
        ) {

            log(
                "✅ Taille 128 KiB.",

            );

            log(

            );
        }

        if (saveInfo) {

            log(

                "info"
            );

            /*

             */

            log(
                "──── SLOT A ────",
                "info"
            );

            for (
                const section
                of saveInfo.blockA.sections
            ) {

                log(
                    `ID ${section.id} | ` +
                    `${hex(section.offset)} | ` +
                    `Index ${section.saveIndex} | ` +
                    `Checksum ` +
                    `${section.checksumValid ? "OK" : "BAD"}`,
                    section.checksumValid
                        ? "ok"
                        : "warning"
                );
            }

            /*
             * SLOT B
             */

            log(
                "──── SLOT B ────",
                "info"
            );

            for (
                const section
                of saveInfo.blockB.sections
            ) {

                log(
                    `ID ${section.id} | ` +
                    `${hex(section.offset)} | ` +
                    `Index ${section.saveIndex} | ` +
                    `Checksum ` +
                    `${section.checksumValid ? "OK" : "BAD"}`,
                    section.checksumValid
                        ? "ok"
                        : "warning"
                );
            }

            /*
             * SECTION 4
             */

            for (
                const block
                of [
                    saveInfo.blockA,
                    saveInfo.blockB
                ]
            ) {

                const section4 =
                    getSection4(
                        block
                    );

                if (!section4) {
                    continue;
                }

                const mysteryOffset =
                    section4.offset +
                    MYSTERY_EVENT_OFFSET;

                log(
                    `🧬 Section 4 détectée à ` +
                    `${hex(section4.offset)}.`,
                    "ok"
                );

                log(
                    `   Mystery Event brut : ` +
                    `${hex(mysteryOffset)}.`,
                    "info"
                );

                const currentME =
                    saveBytes.slice(
                        mysteryOffset,
                        mysteryOffset +
                        MYSTERY_EVENT_SIZE
                    );

                const currentChecksum =
                    readU16LE(
                        currentME,
                        0
                    );

                const calculatedChecksum =
                    calculateMysteryEventChecksum(
                        currentME
                    );

                log(
                    `   ME3 checksum : ` +
                    `${hex(currentChecksum)} / ` +
                    `${hex(calculatedChecksum)}`,
                    currentChecksum ===
                    calculatedChecksum
                        ? "ok"
                        : "warning"
                );
            }
        }
    }


    /*
     * ME3
     */

    log(
        "──── ME3 ────",
        "info"
    );

    if (!me3Bytes) {

        log(
            "❌ Aucun fichier ME3 sélectionné.",
            "error"
        );

    } else {

        log(
            `📦 Taille ME3 : ` +
            `${me3Bytes.length} octets`,
            "info"
        );

        if (me3Info.valid) {

            log(
                "✅ Structure ME3 reconnue.",
                "ok"
            );

            log(
                `Checksum stocké : ` +
                `${hex(me3Info.storedChecksum)}`,
                "info"
            );

            log(
                `Checksum calculé : ` +
                `${hex(me3Info.calculatedChecksum)}`,
                "info"
            );

            log(
                me3Info.checksumValid
                    ? "✅ Checksum ME3 valide."
                    : "⚠️ Checksum ME3 différent. PKHeX le corrige lors de l'import.",
                me3Info.checksumValid
                    ? "ok"
                    : "warning"
            );

            if (
                me3Info.hasRecordMixing
            ) {

                log(
                    "✅ Le fichier contient également un RM3.",
                    "ok"
                );

                log(
                    `RM3 checksum : ` +
                    `${hex(me3Info.recordMixingChecksum)}`,
                    "info"
                );

                log(
                    me3Info.recordMixingChecksumValid
                        ? "✅ RM3 checksum valide."
                        : "⚠️ RM3 checksum à corriger.",
                    me3Info.recordMixingChecksumValid
                        ? "ok"
                        : "warning"
                );
            }
        }
    }


    log(
        "════════════════════════════════════",
        "info"
    );

    log(
        "🔬 Diagnostic terminé.",
        "ok"
    );
}

        const file =
            saveInput.files[0];

        if (!file) {
            return;
        }

        saveName.textContent =

        try {

            const buffer =
                await file.arrayBuffer();

            saveBytes =
                new Uint8Array(
                    buffer
                );

            saveInfo =
                analyzeSave(

                );

            if (!saveInfo.valid) {

                log(

                log(
                    `ℹ️ Slot actif probable : ` +
                    `${saveInfo.latestBlock}`,

/* ============================================================
 * DOWNLOAD
 * ============================================================
 */

downloadButton.addEventListener(
    "click",
    () => {

        if (!generatedSave) {

            log(
                "❌ Aucune sauvegarde générée.",
                "error"
            );

            return;
        }

        const blob =
            new Blob(
                [generatedSave],
                {
                    type:
                        "application/octet-stream"
                }
            );

        const url =
            URL.createObjectURL(
                blob
            );

        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "Emerald_ME3_injected.sav";

        document.body.appendChild(
            link
        );

        link.click();

        link.remove();

        setTimeout(
            () => {
                URL.revokeObjectURL(
                    url
                );
            },
            1000
        );

        log(
            "💾 Téléchargement lancé.",
            "ok"
        );
    }
);
