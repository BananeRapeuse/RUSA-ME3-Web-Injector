<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c12">
<title>R/S ME3 Injector V3.2</title>
<style>
:root{color-scheme:dark;--bg:#090c12;--card:#121722;--card2:#191f2b;--line:#2a3445;--txt:#f5f7fb;--muted:#929caf;--green:#60e58b;--blue:#5bbcff;--yellow:#ffd166;--red:#ff6f7d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -8%,#1a2535 0,#090c12 45%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}.wrap{max-width:760px;margin:auto}header{text-align:center;padding:12px 0 20px}.logo{font-size:42px}h1{font-size:27px;letter-spacing:-.7px;margin:3px 0 5px}.sub{color:var(--muted);font-size:12px}.badge{display:inline-block;margin-top:9px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px}.card{background:rgba(18,23,34,.95);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 16px 40px #0003}.title{font-size:16px;font-weight:850;margin-bottom:12px}
.file_input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.file{display:flex;gap:12px;align-items:center;min-height:68px;padding:12px 14px;background:var(--card2);border:1px solid var(--line);border-radius:15px;cursor:pointer;position:relative}.file:active{transform:scale(.99)}.icon{font-size:26px}.fi{min-width:0}.label{font-size:11px;color:var(--muted)}.name{font-size:13px;font-weight:750;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px}.k{font-size:10px;color:var(--muted)}.v{font-size:12px;font-weight:800;margin-top:4px}.ok{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.small{font-size:12px;color:var(--muted);line-height:1.55}.check{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.check input{width:19px;height:19px;margin:1px 0 0;accent-color:var(--green)}.check b{font-size:13px}.check span{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:3px}button{font:inherit}.primary{width:100%;min-height:57px;border:0;border-radius:15px;background:var(--green);color:#061009;font-size:15px;font-weight:900;cursor:pointer}.primary:disabled{opacity:.32;cursor:not-allowed}.secondary{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--txt);font-weight:800;margin-top:9px;cursor:pointer}.log{background:#07090d;border:1px solid var(--line);border-radius:14px;padding:12px;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:360px;overflow:auto;white-space:pre-wrap}.success{border-color:#60e58b55;background:#60e58b0d}.hidden{display:none}code{font-family:ui-monospace,monospace;color:var(--blue)}@media(max-width:470px){.grid{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">🧬</div><h1>R/S ME3 Injector V3.2</h1><div class="sub">Pokémon Rubis / Saphir · traitement 100 % local dans Safari</div><div class="badge">📱 aucun filtre d’extension iOS</div></header>

<section class="card">
<div class="title">💾 Sauvegarde Rubis / Saphir</div>
<label class="file">
  <input id="save" type="file" class="file_input">
  <div class="icon">🎮</div>
  <div class="fi">
    <div class="label">Choisir la sauvegarde</div>
    <div class="name" id="saveName">Aucun fichier</div>
  </div>
</label>
<div class="grid"><div class="stat"><div class="k">Taille</div><div class="v" id="saveSize">—</div></div><div class="stat"><div class="k">Format</div><div class="v" id="saveFmt">—</div></div><div class="stat"><div class="k">Zone save</div><div class="v" id="saveZone">—</div></div><div class="stat"><div class="k">Blocs</div><div class="v" id="blocks">—</div></div></div>
</section>

<section class="card">
<div class="title">✨ Mystery Event</div>
<label class="file">
  <input id="me3" type="file" class="file_input">
  <div class="icon">📦</div>
  <div class="fi">
    <div class="label">Choisir le fichier .me3</div>
    <div class="name" id="me3Name">Aucun fichier</div>
  </div>
</label>
<div class="grid"><div class="stat"><div class="k">Taille</div><div class="v" id="me3Size">—</div></div><div class="stat"><div class="k">ME3</div><div class="v" id="mePart">—</div></div><div class="stat"><div class="k">RM3</div><div class="v" id="rmPart">—</div></div><div class="stat"><div class="k">Checksum</div><div class="v" id="meChecksum">—</div></div></div>
</section>

<section class="card">
<div class="title">⚙️ Injection</div>
<label class="check"><input id="activate" type="checkbox" checked><div><b>Activer le Mystery Event</b><span>Active le flag événementiel (section 2) lors de l'injection.</span></div></label>
<button class="primary" id="inject" disabled>💉 INJECTER</button>
<button class="secondary" id="diag">🔬 DIAGNOSTIC COMPLET</button>
</section>

<section class="card success hidden" id="result"><div class="title ok">✅ Sauvegarde prête</div><div class="small" id="resultText"></div><button class="primary" id="download">💾 Télécharger la sauvegarde</button></section>

<section class="card"><div class="title">📋 Journal</div><div class="log" id="log">En attente...</div></section>
</div>

<script>
'use strict';

const SAVE_CORE=0x20000;
const SAVE_WITH_16=0x20010;
const BLOCK=0xE000;
const SECTOR=0x1000;
const DATA=0xFF4;
const ID=0xFF4;
const CS=0xFF6;
const SIG=0xFF8;
const CTR=0xFFC;
const SECTION_ME=4;
const SECTION_FLAGS=2;
const ME_REL=0x810;
const RM_REL=0xBFC;

let rawSave=null, saveView=null, saveInfo=null, rawMe=null, meInfo=null, output=null;

const $=id=>document.getElementById(id);
function hx(n,w=4){return '0x'+n.toString(16).toUpperCase().padStart(w,'0')}
function u16(a,o){return (a[o]|a[o+1]<<8)>>>0}
function u32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
function setU16(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255}
function log(s,c=''){let d=document.createElement('div');d.textContent=s;if(c==='ok')d.style.color='#60e58b';if(c==='warn')d.style.color='#ffd166';if(c==='bad')d.style.color='#ff6f7d';$('log').appendChild(d);$('log').scrollTop=$('log').scrollHeight}
function clearLog(){$('log').innerHTML=''}

function sectionChecksum(a,off){
  let sum=0;
  for(let p=off;p<off+DATA;p+=4) sum=(sum+u32(a,p))>>>0;
  sum=(sum+(sum>>>16))>>>0;
  return sum&0xffff;
}

function inspectBlock(a,off){
  const ss=[];
  for(let i=0;i<14;i++){
    const sOff = off + i*SECTOR;
    const id = u16(a, sOff+ID);
    const stored = u16(a, sOff+CS);
    const calc = sectionChecksum(a, sOff);
    ss.push({off:sOff, id, stored, calc, valid: stored===calc, counter: u32(a, sOff+CTR)});
  }
  return {
    off,
    sections: ss,
    validCount: ss.filter(x=>x.valid).length,
    me: ss.find(x=>x.id===SECTION_ME),
    flags: ss.find(x=>x.id===SECTION_FLAGS)
  };
}

function detectSave(bytes){
  let offset = 0;
  let kind = 'raw-0x20000';

  if (bytes.length === SAVE_WITH_16) {
    offset = 16;
    kind = 'wrapper-prefix-16';
  } else if (bytes.length < SAVE_CORE) {
    return { ok: false, reason: 'Fichier trop petit.' };
  }

  const core = bytes.slice(offset, offset + SAVE_CORE);
  const A = inspectBlock(core, 0);
  const B = inspectBlock(core, BLOCK);

  return {
    ok: true, // Forcé à true dès que la taille correspond
    kind,
    start: offset,
    core,
    info: { A, B }
  };
}

function detectME(bytes){
  if(bytes.length!==1004 && bytes.length!==1012) return {ok:false, reason:'Taille attendue : 1004 ou 1012 octets.'};
  const me=bytes.slice(0,1004), rm=bytes.length===1012?bytes.slice(1004):null;
  return {ok:true, me, rm, size:bytes.length};
}

function update(){
  $('inject').disabled = !(saveInfo?.ok && meInfo?.ok);
  if(rawSave){ $('saveSize').textContent = rawSave.length.toLocaleString('fr-FR')+' o'; }
  if(saveInfo?.ok){
    $('saveFmt').textContent = 'R/S Valide';
    $('saveFmt').className = 'v ok';
    $('saveZone').textContent = saveInfo.kind;
    $('blocks').textContent = 'A + B';
  } else if(rawSave){
    $('saveFmt').textContent = '❌ invalide';
    $('saveFmt').className = 'v bad';
    $('saveZone').textContent = '—';
    $('blocks').textContent = '—';
  }
  if(rawMe){
    $('me3Size').textContent = rawMe.length+' o';
    if(meInfo?.ok){
      $('mePart').textContent = '1004 o ✅';
      $('rmPart').textContent = meInfo.rm ? '8 o ✅' : '—';
      $('meChecksum').textContent = 'ME3 détecté';
    }else{
      $('mePart').textContent = '❌';
      $('rmPart').textContent = '—';
      $('meChecksum').textContent = '—';
    }
  }
}

$('save').addEventListener('change', async e => {
  const f = e.target.files?.[0]; if(!f) return;
  clearLog();
  $('saveName').textContent = f.name;
  rawSave = new Uint8Array(await f.arrayBuffer());
  saveInfo = detectSave(rawSave);
  saveView = saveInfo?.core || null;
  update();

  if(saveInfo?.ok){
    log('✅ Sauvegarde R/S chargée !', 'ok');
    log(`📦 ${saveInfo.kind} · Offset de départ: +${saveInfo.start} octets`);
    log(`Bloc A: ${saveInfo.info.A.validCount}/14 sections OK`);
    log(`Bloc B: ${saveInfo.info.B.validCount}/14 sections OK`);
  } else {
    log('❌ Format non reconnu.', 'bad');
  }
});

$('me3').addEventListener('change', async e => {
  const f = e.target.files?.[0]; if(!f) return;
  clearLog();
  $('me3Name').textContent = f.name;
  rawMe = new Uint8Array(await f.arrayBuffer());
  meInfo = detectME(rawMe);
  update();

  if(meInfo.ok){
    log(`✅ ME3 chargé (${meInfo.size} octets)`, 'ok');
  } else {
    log(`❌ ${meInfo.reason}`, 'bad');
  }
});

function diagnostic(){
  clearLog();
  log('════════ DIAGNOSTIC V3.2 ════════');
  if(!saveInfo?.ok) return log('❌ Aucune save valide.', 'bad');

  log(`💾 Fichier : ${rawSave.length} octets (${saveInfo.kind})`, 'ok');
  for(const [n, b] of [['A', saveInfo.info.A], ['B', saveInfo.info.B]]){
    log(`── Bloc ${n} ──`);
    log(`Section 4 Offset: ${hx(b.me ? b.me.off : (n==='A'?4*SECTOR:BLOCK+4*SECTOR))}`);
  }
  if(meInfo?.ok) log(`✨ ME3 valide (${meInfo.size} o)`, 'ok');
}

function inject(){
  clearLog();
  $('result').classList.add('hidden');
  output = null;

  if(!saveInfo?.ok || !meInfo?.ok) throw Error('Sélectionne les 2 fichiers.');

  const core = new Uint8Array(saveView);
  const me = meInfo.me.slice();
  const active = $('activate').checked;

  for(const [n, b] of [['A', saveInfo.info.A], ['B', saveInfo.info.B]]){
    // Calcul de l'offset direct de la section 4 (Mystery Event)
    const meSecOff = b.me ? b.me.off : (n === 'A' ? 4 * SECTOR : BLOCK + 4 * SECTOR);
    const at = meSecOff + ME_REL;

    // Injection du ME3 et du RM3
    core.set(me, at);
    if(meInfo.rm) core.set(meInfo.rm, meSecOff + RM_REL);

    // Recalcul strict du Checksum de la Section 4
    const cs = sectionChecksum(core, meSecOff);
    setU16(core, meSecOff + CS, cs);

    // Activer l'évènement dans la section 2 (Flags) si coché
    if(active){
      const flagsSecOff = b.flags ? b.flags.off : (n === 'A' ? 2 * SECTOR : BLOCK + 2 * SECTOR);
      const p = flagsSecOff + 0x3A9;
      core[p] |= 0x10;
      setU16(core, flagsSecOff + CS, sectionChecksum(core, flagsSecOff));
    }

    log(`✅ Bloc ${n}: JIRACHI.me3 injecté à ${hx(at)}`, 'ok');
    log(`   Nouveau checksum calculé : ${hx(cs)}`, 'ok');
  }

  // Reconstitution du fichier final (conserve le wrapper d'origine s'il existe)
  output = new Uint8Array(rawSave);
  output.set(core, saveInfo.start);

  $('resultText').innerHTML = '<b>Injection réussie !</b><br>JIRACHI.me3 a été injecté dans les 2 blocs de sauvegarde avec checksums corrigés.';
  $('result').classList.remove('hidden');
  log('🎉 Fichier prêt à télécharger !', 'ok');
}

$('diag').onclick = () => { try{ diagnostic(); }catch(e){ log('❌ '+e.message, 'bad'); } };
$('inject').onclick = () => { try{ inject(); }catch(e){ log('❌ '+e.message, 'bad'); } };
$('download').onclick = () => {
  if(!output) return;
  const b = new Blob([output], {type: 'application/octet-stream'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u;
  a.download = 'Pokemon_Sapphire_Jirachi.sav';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
};

update();
</script>
</body>
</html>
