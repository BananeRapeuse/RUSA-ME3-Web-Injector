<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R/S ME3 Injector</title><style>body{margin:0;background:#0b0e14;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:20px}.wrap{max-width:720px;margin:auto}h1{text-align:center}.card{background:#151a24;border:1px solid #2b3444;border-radius:18px;padding:16px;margin:12px 0}label,.btn{display:block;background:#1c2330;border:1px solid #303b4e;border-radius:13px;padding:14px;margin:8px 0;cursor:pointer}.btn{width:100%;color:white;font-weight:800;font-size:16px}.primary{background:#59e58a;color:#07100a;border:0}input{display:none}.name{font-weight:700}.muted{color:#929cad;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#1b2230;padding:10px;border-radius:10px}.log{white-space:pre-wrap;background:#080a0e;padding:12px;border-radius:12px;font:11px monospace;max-height:360px;overflow:auto}.ok{color:#5ee58a}.warn{color:#ffd166}.bad{color:#ff6877}</style></head><body><div class="wrap"><h1>🧬 R/S ME3 Injector</h1><p class="muted">Pokémon Rubis / Saphir · tout est traité localement dans Safari</p><div class="card"><b>💾 Sauvegarde .sav</b><label for="save">Choisir la sauvegarde<div class="name" id="sn">Aucun fichier</div></label><input id="save" type="file" accept=".sav,.bin"><div class="grid"><div class="stat">Taille<br><b id="ss">—</b></div><div class="stat">R/S<br><b id="sf">—</b></div></div></div><div class="card"><b>✨ Event.me3</b><label for="me3">Choisir le ME3<div class="name" id="mn">Aucun fichier</div></label><input id="me3" type="file" accept=".me3,.bin"><div class="grid"><div class="stat">Taille<br><b id="ms">—</b></div><div class="stat">Checksum<br><b id="mc">—</b></div></div></div><div class="card"><label style="display:flex;gap:10px"><input id="activate" type="checkbox" style="display:block;width:20px;height:20px"><span><b>Activer Mystery Event</b><br><span class="muted">R/S : Section 2, offset 0x3A9, bit 4.</span></span></label><button class="btn primary" id="go" disabled>💉 INJECTER</button><button class="btn" id="diag">🔬 DIAGNOSTIC</button></div><div class="card"><div id="log" class="log">En attente…</div></div></div><script>
const S=0x20000,B=0xE000,Q=0x1000,FOOT=0xFF4,ID=0,DATA=0xF80,SEC4=4,SEC2=2,ME=0x810,ME_LEN=1004,FLAG=0x3A9,FLAGBIT=0x10;
const tab=[0x2113,0xff00,0xfc31,0x1311,0xa950,0xf390,0x0b70,0xfb00,0xe700,0xd0fe,0x0002,0xe00f,0x1012,0x90ac,0x10d6,0xf0bc,0x2001,0xcc0b,0x00c0,0xcccc,0xc013,0xc010,0x1330,0x011f,0x0000,0x0cf0,0x1720,0x17d0,0x33f0,0x1980,0x64ff,0xf01b,0xf13b,0xc13b,0x4006,0xf137,0x2137,0x412f,0x1119,0xff10,0x0640,0x0ad1,0x3731,0x1760,0xfa00,0x0721,0x2301,0x0cfd,0x1006,0x0010,0x01ed,0x101c,0x512f,0xc1fc,0xc021,0x1fde,0x00bd,0x700f,0xc021,0x2f11,0x3210,0x1560,0x18cc,0x33cc,0x0c90,0x0fb0,0x01b0,0xbbf0,0x1300,0x1322,0xbbbb,0x1001,0x00bb,0x0bb0,0x17b0,0xef50,0x17d0,0x3230,0x17bb,0xb02f,0xf01e,0xf019,0x6462,0xfff1,0x6310,0x1111,0x5c41,0x4611,0x3b12,0x8c41,0x3f41,0x3bfc,0x1129,0x412d,0xb006,0xf253,0x5253,0x1127,0x00cc,0x7f0c,0x312e,0x0241,0x0004,0x1007,0x5123,0x8253,0x20ba,0xff91,0x0021,0x1b01,0x0400,0x0200,0xd340,0x1c90,0x0ff0,0xff40,0xaaf0,0x1200,0xaa00,0xa0aa,0xaa8f,0x0001,0x0aaa,0xaa80,0x1500,0x1340,0x1600,0x20bf,0xa02f,0xa030,0x1720,0x1af0,0x4c40,0x1af0,0x19e6,0xc7ff,0xb167,0x400a,0xf2c7,0x52c3,0x42c7,0x4178,0xf183,0x6183,0xff11,0x6df1,0x7fb2,0xb342,0xaf71,0x7b60,0x06f1,0x7771];
let save=null,event=null,info=null;
const $=x=>document.getElementById(x), hx=(x,n=4)=>'0x'+x.toString(16).toUpperCase().padStart(n,'0');
const u16=(a,o)=>a[o]|a[o+1]<<8; const set16=(a,o,v)=>{a[o]=v&255;a[o+1]=v>>8&255};
function secsum(a,o,id){let len=id===0?3884:id===13?2000:3968,sum=0;for(let p=0;p<len;p+=4)sum=(sum+(a[o+p] | a[o+p+1]<<8 | a[o+p+2]<<16 | a[o+p+3]<<24)>>>0);sum=(sum+(sum>>>16))>>>0;return sum&65535}
function sections(a,bo){let r=[];for(let i=0;i<14;i++){let o=bo+i*Q,id=u16(a,o+FOOT);r.push({o,id,ok:u16(a,o+FOOT+2)===secsum(a,o,id),idx:(a[o+FOOT+12]|a[o+FOOT+13]<<8|a[o+FOOT+14]<<16|a[o+FOOT+15]<<24)>>>0})}return r}
function blocks(a){return [sections(a,0),sections(a,B)]}
function meChecksum(bytes){let seed=0x8530;for(let i=0;i<bytes.length;i++){let ti=(bytes[i]^seed)&255,v=tab[ti];let rev=((v&255)<<8)|(v>>8);seed=(rev^(seed>>16))&65535}return (~seed)&65535}
function fixEvent(e){let c=meChecksum(e.slice(4,1004));set16(e,0,c);return c}
function find(bl,id){return bl.find(x=>x.id===id)}

$('save').onchange=async()=>{let f=$('save').files[0];if(!f)return;save=new Uint8Array(await f.arrayBuffer());$('sn').textContent=f.name;$('ss').textContent=save.length.toLocaleString('fr-FR')+' o';info=save.length===S?blocks(save):null;$('sf').textContent=info?'R/S Gen III':'❌ taille invalide';log(info?'✅ Save 0x20000 reconnue.':'❌ La save doit faire exactement 131072 octets.',info?'ok':'bad');$('go').disabled=!(info&&event)};
$('me3').onchange=async()=>{let f=$('me3').files[0];if(!f)return;event=new Uint8Array(await f.arrayBuffer());$('mn').textContent=f.name;$('ms').textContent=event.length+' o';if(event.length===1004){let c=meChecksum(event.slice(4));$('mc').textContent=hx(u16(event,0))+' / '+hx(c);log(u16(event,0)===c?'✅ ME3 checksum valide.':'⚠️ checksum ME3 sera corrigé.',u16(event,0)===c?'ok':'warn')}else{$('mc').textContent='❌ taille';log('❌ Un script ME3 doit faire 1004 octets.', 'bad')}$('go').disabled=!(info&&event&&event.length===1004)};
$('diag').onclick=()=>{ $('log').innerHTML='';if(!save){log('❌ Aucune save.','bad');return}if(!info){log('❌ Save invalide.','bad');return}blocks(save).forEach((bl,i)=>{log('── BLOC '+(i?'B':'A')+' ──');bl.forEach(s=>log('ID '+s.id+' '+hx(s.o)+' checksum '+(s.ok?'OK':'BAD')+' index '+s.idx,s.ok?'ok':'warn'));let s4=find(bl,4),s2=find(bl,2);if(s4){let e=save.slice(s4.o+ME,s4.o+ME+1004);log('ME3 cible: '+hx(s4.o+ME)+' checksum '+hx(u16(e,0))+' calculé '+hx(meChecksum(e.slice(4))),u16(e,0)===meChecksum(e.slice(4))?'ok':'warn')}if(s2)log('Activation byte: '+hx(s2.o+FLAG)+' = '+hx(save[s2.o+FLAG],2)+' bit4='+(!!(save[s2.o+FLAG]&FLAGBIT)));})};
$('go').onclick=()=>{try{$('log').innerHTML='';let out=new Uint8Array(save),activate=$('activate').checked;for(let bi=0;bi<2;bi++){let bl=sections(out,bi?B:0),s4=find(bl,4),s2=find(bl,2);if(!s4)throw Error('Section 4 introuvable dans bloc '+(bi?'B':'A'));let e=event.slice();let c=fixEvent(e);out.set(e,s4.o+ME);if(activate&&s2){out[s2.o+FLAG]|=FLAGBIT;set16(out,s2.o+FOOT+2,secsum(out,s2.o,s2.id))}set16(out,s4.o+FOOT+2,secsum(out,s4.o,s4.id));log('✅ Bloc '+(bi?'B':'A')+' : ME3 → '+hx(s4.o+ME)+' checksum '+hx(c),'ok')}let check=blocks(out);for(let bi=0;bi<2;bi++){for(let s of check[bi])if(!s.ok)throw Error('Checksum invalide après injection dans le bloc '+(bi?'B':'A')+' ID '+s.id)}let blob=new Blob([out],{type:'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Ruby_Sapphire_ME3_injected.sav';a.click();URL.revokeObjectURL(url);log('🎉 Injection terminée. Fichier téléchargé.','ok');log(activate?'🔓 Mystery Event activé (Section 2 + 0x3A9 bit 4).':'ℹ️ Activation non modifiée.');}catch(e){log('❌ '+e.message,'bad')}};
</script></body></html>
